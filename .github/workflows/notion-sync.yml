name: Notion 진행상황 자동 업로드

on:
  push:
    branches:
      - main

jobs:
  sync-to-notion:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 커밋 정보 추출
        id: commit
        run: |
          echo "message=$(git log -1 --format='%s')" >> $GITHUB_OUTPUT
          echo "hash=$(git log -1 --format='%h')" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format='%ad' --date=format:'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --format='%an')" >> $GITHUB_OUTPUT

          # 변경 파일 통계
          STATS=$(git diff --stat HEAD~1 HEAD | tail -1)
          echo "stats=$STATS" >> $GITHUB_OUTPUT

          # 변경된 파일 목록 (상위 10개)
          FILES=$(git diff --name-only HEAD~1 HEAD | head -10 | tr '\n' ', ' | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Notion 페이지 생성
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # TODO LIST 데이터베이스 페이지 ID
          NOTION_DATABASE_ID: 35def9f4ad0d8147b0d2c9d57df54cad
        run: |
          TITLE="${{ steps.commit.outputs.message }}"
          DATE="${{ steps.commit.outputs.date }}"
          HASH="${{ steps.commit.outputs.hash }}"
          STATS="${{ steps.commit.outputs.stats }}"
          FILES="${{ steps.commit.outputs.files }}"
          AUTHOR="${{ steps.commit.outputs.author }}"

          curl -s -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d "{
              \"parent\": {
                \"type\": \"database_id\",
                \"database_id\": \"$NOTION_DATABASE_ID\"
              },
              \"properties\": {
                \"할일\": {
                  \"title\": [{ \"text\": { \"content\": \"$TITLE\" } }]
                },
                \"진행 사항\": {
                  \"status\": { \"name\": \"완료\" }
                },
                \"카테고리\": {
                  \"select\": { \"name\": \"개인 업무\" }
                },
                \"해치울 날\": {
                  \"date\": { \"start\": \"$DATE\" }
                }
              },
              \"children\": [
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"📋 작업 개요\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"커밋: $HASH | 작성자: $AUTHOR\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"📝 변경 파일\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"$FILES\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"📊 변경 규모\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"$STATS\" } }]
                  }
                }
              ]
            }"
