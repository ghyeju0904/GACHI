name: 일일 회고 자동 업로드

on:
  schedule:
    - cron: '55 14 * * *'  # 매일 23:55 KST (14:55 UTC)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  daily-recap:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 오늘 날짜 설정 (KST)
        id: date
        run: |
          # KST = UTC+9
          TODAY=$(TZ='Asia/Seoul' date '+%Y-%m-%d')
          TODAY_DISPLAY=$(TZ='Asia/Seoul' date '+%Y년 %m월 %d일')
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "today_display=$TODAY_DISPLAY" >> $GITHUB_OUTPUT

      - name: 오늘 커밋 수집 (00:00~23:59 KST)
        id: commits
        run: |
          TODAY="${{ steps.date.outputs.today }}"

          # KST 00:00 ~ 23:59를 UTC로 변환
          START_UTC=$(TZ='Asia/Seoul' date -d "${TODAY} 00:00:00" -u '+%Y-%m-%dT%H:%M:%S')
          END_UTC=$(TZ='Asia/Seoul' date -d "${TODAY} 23:59:59" -u '+%Y-%m-%dT%H:%M:%S')

          # 오늘 커밋 목록 (해시|제목|시각)
          COMMITS=$(git log --after="$START_UTC" --before="$END_UTC" \
            --format='%h|%s|%ad' --date=format:'%H:%M' 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "has_commits=false" >> $GITHUB_OUTPUT
            echo "commit_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_commits=true" >> $GITHUB_OUTPUT

          # 커밋 수
          COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT

          # 전체 변경 통계
          FIRST_HASH=$(echo "$COMMITS" | tail -1 | cut -d'|' -f1)
          LAST_HASH=$(echo "$COMMITS" | head -1 | cut -d'|' -f1)
          STATS=$(git diff --stat ${FIRST_HASH}~1 ${LAST_HASH} 2>/dev/null | tail -1 || echo "통계 없음")
          echo "stats=$STATS" >> $GITHUB_OUTPUT

          # 커밋 목록 (Notion 블록용 — 줄바꿈을 \n으로)
          LIST=""
          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d'|' -f1)
            MSG=$(echo "$line"  | cut -d'|' -f2)
            TIME=$(echo "$line" | cut -d'|' -f3)
            LIST="${LIST}• [${TIME}] ${MSG} (${HASH})\n"
          done <<< "$COMMITS"
          # 마지막 \n 제거
          LIST="${LIST%\\n}"
          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          echo -e "$LIST"         >> $GITHUB_OUTPUT
          echo "EOF"              >> $GITHUB_OUTPUT

      - name: Notion 일일 회고 페이지 생성
        if: steps.commits.outputs.has_commits == 'true'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: 35def9f4ad0d8147b0d2c9d57df54cad
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          TODAY_DISPLAY="${{ steps.date.outputs.today_display }}"
          COUNT="${{ steps.commits.outputs.commit_count }}"
          STATS="${{ steps.commits.outputs.stats }}"
          COMMIT_LIST="${{ steps.commits.outputs.commit_list }}"

          # JSON 특수문자 이스케이프
          COMMIT_LIST_ESCAPED=$(echo "$COMMIT_LIST" | python3 -c "
          import sys, json
          data = sys.stdin.read().rstrip()
          print(json.dumps(data)[1:-1])
          ")

          curl -s -X POST "https://api.notion.com/v1/pages" \
            -H "Authorization: Bearer $NOTION_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d "{
              \"parent\": {
                \"type\": \"database_id\",
                \"database_id\": \"$NOTION_DATABASE_ID\"
              },
              \"properties\": {
                \"할일\": {
                  \"title\": [{ \"text\": { \"content\": \"📅 일일 회고 — $TODAY\" } }]
                },
                \"진행 사항\": {
                  \"status\": { \"name\": \"완료\" }
                },
                \"카테고리\": {
                  \"select\": { \"name\": \"개인 업무\" }
                },
                \"해치울 날\": {
                  \"date\": { \"start\": \"$TODAY\" }
                }
              },
              \"children\": [
                {
                  \"object\": \"block\",
                  \"type\": \"callout\",
                  \"callout\": {
                    \"icon\": { \"type\": \"emoji\", \"emoji\": \"📆\" },
                    \"color\": \"gray_background\",
                    \"rich_text\": [{ \"text\": { \"content\": \"$TODAY_DISPLAY 자동 생성 회고 | 커밋 ${COUNT}건 | $STATS\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"🗂 오늘 한 작업 (00:00 ~ 23:59 KST)\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"$COMMIT_LIST_ESCAPED\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"1️⃣ 업무를 하며 어려웠던 점이나 아쉬웠던 점\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"2️⃣ 해결 방법 / 필요한 지원\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"3️⃣ 만족스러웠던 부분 / 성장한 점\" } }]
                  }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": {
                    \"rich_text\": [{ \"text\": { \"content\": \"\" } }]
                  }
                }
              ]
            }"

      - name: 커밋 없는 날 스킵 안내
        if: steps.commits.outputs.has_commits == 'false'
        run: echo "오늘(${{ steps.date.outputs.today }}) 커밋 없음 — Notion 업로드 건너뜀"
